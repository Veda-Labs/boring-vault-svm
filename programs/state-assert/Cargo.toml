[package]
name = "state-assert"
version = "0.1.0"
description = "A utility program for asserting on-chain state conditions during transaction execution. Useful for verifying account data, balances, and other properties in atomic transactions."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "state_assert"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
