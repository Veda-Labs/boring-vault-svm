[package]
name = "boring-onchain-queue"
version = "0.1.0"
description = "Manages the asynchronous withdrawal process for Boring Vault. Handles withdrawal requests, maturity periods, and the fulfillment of withdrawals by burning shares and returning assets."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "boring_onchain_queue"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
rust_decimal = { workspace = true }
boring-vault-svm = { path = "../boring-vault-svm", features = ["cpi"] }
